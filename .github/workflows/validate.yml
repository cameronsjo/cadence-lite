name: Validate portable agents
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - name: Check committed whitespace
        env:
          CADENCE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$CADENCE_DIFF_BASE" ] || [ "$CADENCE_DIFF_BASE" = "0000000000000000000000000000000000000000" ]; then
            CADENCE_DIFF_BASE=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$CADENCE_DIFF_BASE" HEAD
